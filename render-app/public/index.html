<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Evo Ninja v1</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0a0d12;color:#e9edf5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#151c29 0,#0a0d12 45%);min-height:100vh}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}.card{background:#111722cc;border:1px solid #263044;border-radius:20px;box-shadow:0 18px 60px #0005;backdrop-filter:blur(10px);padding:18px;margin-bottom:16px}
h1{font-size:28px;margin:0 0 4px}.muted{color:#98a3b8;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
textarea{width:100%;min-height:110px;resize:vertical;background:#0c111a;color:#fff;border:1px solid #2a3549;border-radius:14px;padding:14px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;background:#6ea8fe;color:#06111f;font-weight:700;cursor:pointer}.btn.alt{background:#202a3a;color:#dfe8f5}.btn:disabled{opacity:.5;cursor:not-allowed}
#mic{width:52px;height:52px;border-radius:50%;font-size:22px}.status{margin-top:10px;min-height:22px}.pill{display:inline-block;border:1px solid #2a3549;border-radius:999px;padding:5px 9px;font-size:12px;color:#b9c4d7;margin-right:6px;margin-top:6px}
.trace{display:flex;flex-direction:column;gap:10px}.item{border:1px solid #273349;border-radius:13px;padding:12px;background:#0c1119}.item b{font-size:13px}.item pre{white-space:pre-wrap;overflow:auto;margin:7px 0 0;color:#cbd6e8;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.final{border-color:#375d42;background:#0f1b13}.final h2{margin:0 0 8px;font-size:18px}
@media(max-width:620px){main{padding:14px 10px 32px}h1{font-size:23px}.card{padding:14px;border-radius:16px}}
</style>
</head>
<body>
<main>
<section class="card"><div class="row"><div class="grow"><h1>🧠 Evo Ninja v1</h1><div class="muted">Voice-first multi-agent goal executor</div></div><div id="providers"></div></div></section>
<section class="card">
<textarea id="goal" placeholder="Type your goal here, or press the microphone and speak..."></textarea>
<div class="row" style="margin-top:10px"><button class="btn" id="run">Run goal</button><button class="btn alt" id="mic" title="Voice input">🎙️</button><button class="btn alt" id="clear">Clear</button><div id="status" class="status grow muted"></div></div>
</section>
<section class="card"><div class="muted" style="margin-bottom:8px">Execution trace</div><div id="trace" class="trace"></div></section>
<section class="card final"><h2>Final answer</h2><div id="final">No result yet.</div></section>
</main>
<script>
const $=id=>document.getElementById(id); const goal=$('goal'); const status=$('status'); const trace=$('trace'); const finalEl=$('final');
let recording=false,audioCtx=null,stream=null,source=null,processor=null,stt=null;
function setStatus(x){status.textContent=x}
function addTrace(x){const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+escapeHtml(x.title||x.type||'step')+'</b><pre>'+escapeHtml(x.body||'')+'</pre>';trace.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadConfig(){try{const r=await fetch('/api/config');const c=await r.json();$('providers').innerHTML='<span class="pill">Gemini: '+c.models.gemini+'</span><span class="pill">OpenRouter: '+c.models.openrouter+'</span><span class="pill">AssemblyAI STT</span>'}catch{}}
async function runGoal(){const text=goal.value.trim();if(!text)return;trace.innerHTML='';finalEl.textContent='Running...';setStatus('Controller is planning and routing agents...');$('run').disabled=true;try{const r=await fetch('/api/goal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:text})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');for(const t of (j.trace||[])){if(t.type==='plan')addTrace({title:`Step ${t.step} • Planner → ${t.agent}`,body:`${t.task}\n\nReason: ${t.reason||''}`});else if(t.type==='agent')addTrace({title:`Step ${t.step} • Agent: ${t.agent}`,body:t.output});else addTrace({title:`Step ${t.step} • Goal verifier`,body:`Achieved: ${t.achieved}\n${t.reason||''}`})}finalEl.textContent=j.finalAnswer||'Goal loop ended without a final answer.';setStatus(j.completed?'Goal achieved.':'Goal loop ended before verification passed.')}catch(e){finalEl.textContent=e.message;setStatus('Error')}finally{$('run').disabled=false}}
$('run').onclick=runGoal;$('clear').onclick=()=>{goal.value='';trace.innerHTML='';finalEl.textContent='No result yet.';setStatus('')};
function downsample(buffer,fromRate,toRate){if(toRate===fromRate)return buffer;const ratio=fromRate/toRate;const len=Math.round(buffer.length/ratio);const out=new Float32Array(len);for(let i=0;i<len;i++){const pos=i*ratio;const idx=Math.floor(pos);const frac=pos-idx;out[i]=(buffer[idx]||0)*(1-frac)+(buffer[idx+1]||0)*frac}return out}
function floatTo16(samples){const out=new Int16Array(samples.length);for(let i=0;i<samples.length;i++){const s=Math.max(-1,Math.min(1,samples[i]));out[i]=s<0?s*0x8000:s*0x7fff}return out}
async function startMic(){if(recording)return; if(!window.AudioContext && !window.webkitAudioContext){setStatus('This browser does not support Web Audio.');return} recording=true;$('mic').textContent='⏹️';setStatus('Connecting to AssemblyAI STT...');stt=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/stt?sample_rate=16000');
stt.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='ready'){setStatus('Listening... speak now.')} else if(m.type==='Turn'){const text=m.transcript||m.text||'';if(text){goal.value=(goal.value?goal.value+' ':'')+text}} else if(m.message_type==='FinalTranscript'||m.message_type==='PartialTranscript'){const text=m.text||'';if(text&&m.message_type==='FinalTranscript')goal.value=(goal.value?goal.value+' ':'')+text}}catch{}};
stt.onerror=()=>setStatus('STT connection error');
stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new (window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaStreamSource(stream);processor=audioCtx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(!recording||!stt||stt.readyState!==WebSocket.OPEN)return;const mono=e.inputBuffer.getChannelData(0);const ds=downsample(mono,audioCtx.sampleRate,16000);stt.send(floatTo16(ds).buffer)};source.connect(processor);processor.connect(audioCtx.destination)}
function stopMic(){recording=false;$('mic').textContent='🎙️';try{processor?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());audioCtx?.close();stt?.close()}catch{}setStatus('Voice input stopped.')}
$('mic').onclick=()=>recording?stopMic():startMic(); loadConfig();
</script>
</body></html>
